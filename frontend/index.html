<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analisador de Artigos</title>
    <script>
      // Roda antes do CSS pintar: sem isto a pagina aparece no tema do
      // sistema por um instante antes do React aplicar a sua escolha.
      try {
        var t = localStorage.getItem("analisador:tema");
        if (t === "claro" || t === "escuro") {
          document.documentElement.setAttribute("data-tema", t);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
